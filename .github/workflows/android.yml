name: Android APK

on:
  push:
    branches: [main]
    paths: ["www/**", "android/**", "tools/**", "package.json", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      MAMA_STORE_PASSWORD: ${{ secrets.MAMA_STORE_PASSWORD }}
      MAMA_KEY_PASSWORD: ${{ secrets.MAMA_KEY_PASSWORD }}
      MAMA_KEY_ALIAS: ${{ secrets.MAMA_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Зависимости и синхронизация
        run: |
          echo "MIN_NATIVE=$(cat android/NATIVE_VERSION)" >> "$GITHUB_ENV"
          echo "{\"code\": ${{ github.run_number }}}" > www/build.json
          cat www/build.json
          npm ci
          for f in www/*.js; do node --check "$f" || exit 1; done
          npm i --no-save playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node tools/smoke.cjs www
          sh tools/minify.sh www
          node tools/smoke.cjs www
          echo "{\"code\": ${{ github.run_number }}, \"minNative\": $(cat android/NATIVE_VERSION)}" > update.json
          (cd www && zip -qr ../web.zip .)
          ls -la web.zip update.json
          npx cap sync android

      - name: Компилиране (APK + AAB за Google Play)
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../MAMA-1.0.${VERSION_CODE}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../MAMA-1.0.${VERSION_CODE}.aab
          cp app/build/outputs/apk/release/app-release.apk ../MAMA.apk

      # Нов ключ чрез „завъртане“ (APK Signature Scheme v3): Android 9+ приема новия ключ като наследник на стария,
      # Android 7–8 продължават със стария. Никой не преинсталира. Без тайната MAMA_NEXT_PASS — само пробно завъртане.
      - name: Подпис с новия ключ (завъртане без преинсталиране)
        env:
          MAMA_NEXT_PASS: ${{ secrets.MAMA_NEXT_PASS }}
        run: |
          set -e
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          OLD=android/keystore/mama-release.jks
          OP="${MAMA_STORE_PASSWORD:-mama-release-2026}"; OKP="${MAMA_KEY_PASSWORD:-mama-release-2026}"; OA="${MAMA_KEY_ALIAS:-mama}"
          if [ -n "$MAMA_NEXT_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore/mama-next.jks.enc -out "$RUNNER_TEMP/next.jks" -pass env:MAMA_NEXT_PASS
            NEW="$RUNNER_TEMP/next.jks"; NP="$MAMA_NEXT_PASS"; NA=mama2; MODE=real
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/dry.jks" -storetype PKCS12 -alias dry -keyalg RSA -keysize 2048 -validity 2 -storepass drypass1 -keypass drypass1 -dname CN=dry >/dev/null 2>&1
            NEW="$RUNNER_TEMP/dry.jks"; NP=drypass1; NA=dry; MODE=dry
          fi
          "$AS" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks "$OLD" --ks-key-alias "$OA" --ks-pass "pass:$OP" --key-pass "pass:$OKP" \
            --new-signer --ks "$NEW" --ks-key-alias "$NA" --ks-pass "pass:$NP" --key-pass "pass:$NP"
          "$AS" sign --ks "$OLD" --ks-key-alias "$OA" --ks-pass "pass:$OP" --key-pass "pass:$OKP" \
            --next-signer --ks "$NEW" --ks-key-alias "$NA" --ks-pass "pass:$NP" --key-pass "pass:$NP" \
            --lineage "$RUNNER_TEMP/lineage.bin" --rotation-min-sdk-version 28 --out "$RUNNER_TEMP/rotated.apk" MAMA.apk
          "$AS" verify -v --print-certs "$RUNNER_TEMP/rotated.apk" | grep -E "Verified using|Number of signers|certificate SHA-256" | head -12
          if [ "$MODE" = real ]; then
            cp "$RUNNER_TEMP/rotated.apk" MAMA.apk; cp "$RUNNER_TEMP/rotated.apk" "MAMA-1.0.${VERSION_CODE}.apk"
            echo "✅ Подписано с новия ключ (Android 9+) и стария (Android 7–8)"
          else
            echo "ℹ️ Пробното завъртане мина. Истинското започва, щом се добави тайната MAMA_NEXT_PASS."
          fi
          rm -f "$RUNNER_TEMP/next.jks" "$RUNNER_TEMP/dry.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MAMA-1.0.${{ github.run_number }}
          path: |
            MAMA-*.apk
            MAMA-*.aab

      - name: Издание (Release) с APK за сваляне от телефона
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MAMA 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            MAMA — My Amazing Market Area. Свали **MAMA.apk** на телефона и го инсталирай. Постоянен линк към последната версия: https://github.com/ngerchev-code/mama/releases/latest/download/MAMA.apk
            Файлът .aab е за качване в Google Play Console.
            Инсталираното приложение получава новия код автоматично (web.zip) — без нова инсталация.
            minNative: ${{ env.MIN_NATIVE }}
          files: |
            MAMA.apk
            web.zip
            update.json
            MAMA-*.apk
            MAMA-*.aab

      - name: Доклад при грешка
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Компилирането на APK #${{ github.run_number }} спря."
            echo
            echo '```'
            if [ -f gradle.log ]; then grep -nE "What went wrong|error:|FAILED|Exception|> " gradle.log | head -60; echo "-----"; tail -120 gradle.log; else echo "gradle.log липсва (грешката е преди компилирането)"; fi
            echo '```'
          } > report.md
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "APK грешка #${{ github.run_number }}" --body-file report.md || true
