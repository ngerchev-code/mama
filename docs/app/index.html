<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10233a">
  <title>MAMA — My Amazing Market Area</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MAMA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 120 120" width="150" height="150"><circle class="sp-glow" cx="60" cy="78" r="34" fill="#2ed49a"/><path d="M32 56 C32 24, 88 24, 88 56" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><g class="sp-leaf"><path d="M60 52 C56 40, 63 30, 76 28 C78 40, 70 49, 60 52 Z" fill="#b6f36a"/></g><path d="M22 56 H98 L90 96 C89 100, 86 102, 82 102 H38 C34 102, 31 100, 30 96 Z" fill="#2ed49a"/><rect x="18" y="51" width="84" height="10" rx="5" fill="#6ff0c2"/><path class="sp-line" pathLength="100" d="M30 80 H44 L49 70 L55 92 L61 63 L67 84 L71 80 H86" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><circle class="sp-dot" cx="88" cy="80" r="4.5" fill="#ff5f6d"/></svg>
    <div class="sp-name">MAMA</div>
    <div class="sp-sub">Здраве във всяка кошница</div>
  </div>
  <script>setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('out');setTimeout(function(){s.remove()},500)}},1700);</script>
  <header class="appbar" id="appbar">
    <button class="iconbtn back" id="backBtn" aria-label="Назад">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 120 120"><rect width="120" height="120" rx="26" fill="#10233a"/><path d="M32 56 C32 24, 88 24, 88 56" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M60 52 C56 40, 63 30, 76 28 C78 40, 70 49, 60 52 Z" fill="#b6f36a"/><path d="M22 56 H98 L90 96 C89 100, 86 102, 82 102 H38 C34 102, 31 100, 30 96 Z" fill="#2ed49a"/><rect x="18" y="51" width="84" height="10" rx="5" fill="#6ff0c2"/><path d="M30 80 H44 L49 70 L55 92 L61 63 L67 84 L71 80 H86" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="88" cy="80" r="4.5" fill="#ff5f6d"/></svg>
    </div>
    <div class="grow">
      <h1 id="title">MAMA</h1>
      <div class="sub" id="subtitle">My Amazing Market Area</div>
    </div>
    <button class="iconbtn" id="refreshBtn" aria-label="Обнови данните">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
    </button>
  </header>

  <main>
    <section class="screen" id="s-home"></section>
    <section class="screen" id="s-prices"></section>
    <section class="screen" id="s-list"></section>
    <section class="screen" id="s-recipes"></section>
    <section class="screen" id="s-more"></section>
    <section class="screen" id="s-stats"></section>
    <section class="screen" id="s-news"></section>
    <section class="screen" id="s-stores"></section>
    <section class="screen" id="s-online"></section>
    <section class="screen" id="s-banned"></section>
    <section class="screen" id="s-settings"></section>
    <section class="screen" id="s-doctor"></section>
    <section class="screen" id="s-world"></section>
    <section class="screen" id="s-calendar"></section>
    <section class="screen" id="s-scan"></section>
    <section class="screen" id="s-activity"></section>
    <section class="screen" id="s-chat"></section>
  </main>

  <nav class="bottom" id="nav">
    <button data-go="home" class="active"><span class="pill"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg></span>Начало</button>
    <button data-go="prices"><span class="pill"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M21.4 11.6 12.4 2.6A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7c0 .55.22 1.05.59 1.42l9 9a2 2 0 0 0 2.82 0l7-7a2 2 0 0 0 0-2.82zM5.5 7A1.5 1.5 0 1 1 7 5.5 1.5 1.5 0 0 1 5.5 7z"/></svg></span>Цени</button>
    <button data-go="list"><span class="pill"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 18a2 2 0 1 0 2 2 2 2 0 0 0-2-2zm10 0a2 2 0 1 0 2 2 2 2 0 0 0-2-2zM7.2 14.8h9.5a2 2 0 0 0 1.75-1.03L22 7.2 20.25 6l-3.55 6.8H8.1L4.3 4H1v2h2l3.6 7.6-1.35 2.44A2 2 0 0 0 7 19h12v-2H7.4z"/></svg></span>Списък<i class="badge" id="listBadge" hidden></i></button>
    <button data-go="recipes"><span class="pill"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8.1 13.34 10.93 10.5 3.91 3.5a4 4 0 0 0 0 5.66zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13z"/></svg></span>Меню</button>
    <button data-go="more"><span class="pill"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 8h4V4H4zm6 12h4v-4h-4zm-6 0h4v-4H4zm0-6h4v-4H4zm6 0h4v-4h-4zm6-10v4h4V4zm-6 4h4V4h-4zm6 6h4v-4h-4zm0 6h4v-4h-4z"/></svg></span>Още</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="doctor.js"></script>
  <script src="doctor2.js"></script>
  <script src="world.js"></script>
  <script src="guide.js"></script>
  <script src="holidays.js"></script>
  <script src="vendor/zxing.min.js"></script>
  <script src="scanner.js"></script>
  <script src="doctor3.js"></script>
  <script src="extras.js"></script>
  <script src="shop2.js"></script>
  <script src="events.js"></script>
  <script src="update.js"></script>
  <script src="usage.js"></script>
  <script src="ebag.js"></script>
  <script src="breakfast.js"></script>
  <script src="chat.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
      navigator.serviceWorker.register('sw.js').catch(function () {});

</body>
