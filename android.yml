name: Android APK

on:
  push:
    branches: [main]
    paths: ["www/**", "android/**", "package.json", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      MAMA_STORE_PASSWORD: ${{ secrets.MAMA_STORE_PASSWORD }}
      MAMA_KEY_PASSWORD: ${{ secrets.MAMA_KEY_PASSWORD }}
      MAMA_KEY_ALIAS: ${{ secrets.MAMA_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Зависимости и синхронизация
        run: |
          npm ci
          npx cap sync android

      - name: Компилиране (APK + AAB за Google Play)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MAMA-1.0.${VERSION_CODE}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../MAMA-1.0.${VERSION_CODE}.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MAMA-1.0.${{ github.run_number }}
          path: |
            MAMA-*.apk
            MAMA-*.aab

      - name: Издание (Release) с APK за сваляне от телефона
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MAMA 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            MAMA — My Amazing Market Area. Свали **MAMA-1.0.${{ github.run_number }}.apk** на телефона и го инсталирай.
            Файлът .aab е за качване в Google Play Console.
          files: |
            MAMA-*.apk
            MAMA-*.aab
